
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1155099145744921"
     crossorigin="anonymous"></script>
         
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
            },
            colors: {
              medical: {
                primary: '#0f172a',   /* Slate 900 - Official Professional Look */
                secondary: '#1e293b', /* Slate 800 */
                accent: '#0ea5e9',    /* Sky Blue Accent */
                surface: '#fafbfc',
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-soft': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      * { -webkit-tap-highlight-color: transparent; outline: none; }
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #fafbfc;
        overscroll-behavior-y: contain;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      html.dark body {
        background-color: #020617; 
        color: #f1f5f9;
      }

      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .scroll-smooth { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
      
      .truncate-multiline {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media print {
        @page { size: A4; margin: 1cm; }
        html, body, #root { 
          height: auto !important; 
          overflow: visible !important; 
          position: static !important;
          background: white !important; 
          color: black !important;
        }
        .fixed { position: static !important; }
        .print-grid { 
          display: grid !important; 
          grid-template-columns: repeat(2, 1fr) !important; 
          gap: 15px !important; 
        }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        h1, h2, h3, p, span { color: black !important; text-shadow: none !important; }
        a { text-decoration: none !important; color: black !important; }
      }
      .print-only { display: none; }

      /* Shadow for the logo in light mode */
      .logo-shadow {
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
      }
      /* Turns the logo creamy white and adds a shadow in dark mode */
      .dark .logo-inverts-on-dark {
        filter: invert(92%) sepia(11%) saturate(233%) hue-rotate(344deg) brightness(108%) contrast(101%) drop-shadow(0 2px 6px rgba(0,0,0,0.35));
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body class="text-slate-900 dark:text-slate-100 antialiased select-none overflow-hidden fixed inset-0 print:static print:overflow-visible print:h-auto transition-colors duration-300">
    <div id="root" class="h-full w-full print:h-auto print:static"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
