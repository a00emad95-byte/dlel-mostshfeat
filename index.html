      .scroll-smooth { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
      
      .truncate-multiline {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media print {
        @page { size: A4; margin: 1cm; }
        html, body, #root { 
          height: auto !important; 
          overflow: visible !important; 
          position: static !important;
          background: white !important; 
          color: black !important;
        }
        .fixed { position: static !important; }
        .print-grid { 
          display: grid !important; 
          grid-template-columns: repeat(2, 1fr) !important; 
          gap: 15px !important; 
        }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        h1, h2, h3, p, span { color: black !important; text-shadow: none !important; }
        a { text-decoration: none !important; color: black !important; }
      }
      .print-only { display: none; }

      /* Shadow for the logo in light mode */
      .logo-shadow {
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
      }
      /* Turns the logo creamy white and adds a shadow in dark mode */
      .dark .logo-inverts-on-dark {
        filter: invert(92%) sepia(11%) saturate(233%) hue-rotate(344deg) brightness(108%) contrast(101%) drop-shadow(0 2px 6px rgba(0,0,0,0.35));
